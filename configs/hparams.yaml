# Single source of truth for benchmark hyperparameters
optimizer:
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.06
  max_length: 128
  train_batch_size: 16
  eval_batch_size: 32
  seed: 42

models:
  xlmr: "xlm-roberta-base"
  mbert: "bert-base-multilingual-cased"
  muril: "google/muril-base-cased"

grid:
  k_values: [0, 1, 3]
  epochs: [2, 3, 4]
  apply_length_filter: true
  min_tokens: 2
  max_tokens: 80

ekman6:
  k: 1
  epochs: 3
  apply_length_filter: false
  early_stopping_patience: 1
  load_best_model_at_end: true
  metric_for_best_model: "eval_f1_macro"
  greater_is_better: true

ablation_size_controlled:
  k: 3
  epochs: 3
  target_train_size: 42493
  seed: 42

seed_robustness:
  model: "xlmr"
  k: 3
  epochs: 3
  seeds: [42, 43, 44]
